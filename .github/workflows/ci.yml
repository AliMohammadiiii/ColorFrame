name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install GNU time (peak-RSS measurement, D-020) and GCC 14
        run: sudo apt-get update -q && sudo apt-get install -y -q time g++-14

      - name: Run tests (default compiler)
        run: make test

      - name: C++ with GCC 14 under -Werror (portability, rc2)
        run: |
          make -C cpp clean
          make -C cpp CXX=g++-14 all test
          python3 tests/run_cases.py --impl cpp
          python3 tests/test_cli_required_flags.py cpp
